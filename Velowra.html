<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Velowra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#FFE9F1;--surface:#FFFDF5;--ink:#3A1E2B;--muted:#7C6370;--line:#F5CFDD;--accent:#C93A78;--art:#FFF0B8;--tag:#3A1E2B;--tagink:#fff;--yellow:#FFD84D;--yink:#3A1E2B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1B1117;--surface:#271922;--ink:#F6E7ED;--muted:#BFA2AF;--line:#3C2833;--accent:#E56E9A;--art:#33202B;--tag:#F6E7ED;--tagink:#1B1117}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1B1117;--surface:#271922;--ink:#F6E7ED;--muted:#BFA2AF;--line:#3C2833;--accent:#E56E9A;--art:#33202B;--tag:#F6E7ED;--tagink:#1B1117}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.7}
h1,h2,h3,.brand,button{font-family:"Readex Pro","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
.brand{font-weight:700;font-size:24px;letter-spacing:.04em;direction:ltr;color:var(--ink);text-decoration:none}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ic{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:99px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
.ic.y{background:var(--yellow);color:var(--yink);border-color:var(--yellow);font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:1000px;margin:auto;padding:0 16px 40px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;padding:32px 0 24px}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.1;margin:0 0 8px;direction:ltr;text-align:start;background:linear-gradient(90deg,#C93A78,#F2A900);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h2{font-size:clamp(18px,3.4vw,26px);margin:0 0 12px;font-weight:600}
.hero p{margin:0 0 20px;color:var(--muted);max-width:30em}
.btn,.cta{display:inline-block;border:0;background:var(--yellow);color:var(--yink);padding:12px 24px;border-radius:99px;font-weight:700;cursor:pointer;text-decoration:none;font-size:15px}
.btn.o{background:none;border:1px solid var(--accent);color:var(--accent)}
.hero-art,.art{display:grid;place-items:center;position:relative;color:var(--accent);background:var(--art)}
.hero-art{border-radius:28px;aspect-ratio:1/1;background:linear-gradient(135deg,#FFE27A,#FFC2D8);overflow:hidden;color:#B03A6A}
.hero-art::before,.hero-art::after{content:"";position:absolute;border-radius:50%;opacity:.55}
.hero-art::before{width:42%;aspect-ratio:1;background:#FFF6C9;top:-8%;inset-inline-end:-6%;animation:drift 7s ease-in-out infinite}
.hero-art::after{width:30%;aspect-ratio:1;background:#FF9EC1;bottom:-6%;inset-inline-start:-4%;animation:drift 9s ease-in-out infinite reverse}
.hero-art svg{width:60%;position:relative;z-index:1;animation:float 4s ease-in-out infinite}
h2.sec{font-size:24px;margin:28px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{display:flex;flex-direction:column;color:inherit;text-decoration:none}
.card .art{aspect-ratio:1/1.05;border-radius:20px;overflow:hidden;transition:transform .3s}
.card:hover .art{transform:translateY(-6px) rotate(-1deg)}
.art svg{width:58%;height:auto}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--tag);color:var(--tagink);font-size:12px;padding:2px 12px;border-radius:99px;z-index:2}
.info{padding:10px 4px;display:flex;flex-direction:column;gap:2px}
.info h3{margin:0;font-size:17px}
.price{font-weight:700}
.price.q{font-weight:400;color:var(--muted);font-size:14px}
.back{display:inline-block;margin:18px 0 8px;color:var(--accent);cursor:pointer;background:none;border:0;font-size:15px;padding:0}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.pd .art{border-radius:24px;aspect-ratio:1/1;overflow:hidden}
.pd h1{margin:0 0 8px;font-size:clamp(24px,4.5vw,34px);line-height:1.3}
.pd .price{font-size:22px;display:block;margin:12px 0}
.pd p{margin:0 0 12px}
.pd ul{padding:0;margin:8px 0 18px;list-style:none}
.pd li{padding:8px 0;border-bottom:1px solid var(--line)}
.pd li::before{content:"✓";color:var(--accent);margin-inline-end:10px;font-weight:700}
.sizes{display:flex;align-items:center;gap:8px;margin:4px 0 16px;flex-wrap:wrap}
.sizes b{margin-inline-end:4px}
.sz{min-width:60px;padding:6px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;line-height:1.3}
.sz small{display:block;color:var(--muted);font-size:11px}
.sz[aria-pressed="true"]{background:var(--yellow);color:var(--yink);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.sz[aria-pressed="true"] small{color:var(--yink)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:40px}
.perks div{background:var(--surface);border-radius:16px;padding:14px 16px;color:var(--muted);animation:up .6s .3s both}
.perks b{display:block;color:var(--ink)}
footer{text-align:center;color:var(--muted);padding:24px 16px 120px;font-size:14px}
footer a{color:var(--accent);margin:0 8px}
.cbar{position:fixed;inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto;z-index:35;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18);max-height:80vh;overflow:auto}
.cr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cx{display:flex;align-items:center;gap:8px}
.cbar button{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.cbar .tg{background:var(--yellow);color:var(--yink);font-weight:700;font-size:14px;padding:8px 16px;border-radius:99px}
.cf{display:none;margin-top:10px;flex-direction:column;gap:8px}
.cbar.open .cf{display:flex}
.cf input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.pm{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.pm label{display:flex;gap:6px;align-items:center;cursor:pointer}
.cf small{color:var(--muted)}
.cf textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
.cf>a{display:block;text-align:center;background:var(--yellow);color:var(--yink);text-decoration:none;font-weight:700;padding:12px;border-radius:99px}
.cf>a.off{opacity:.45;pointer-events:none}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:40;display:none;max-width:90%;text-align:center}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(14px,-18px) scale(1.15)}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.hero>div:first-child>*{animation:up .7s both}
.hero>div:first-child>:nth-child(2){animation-delay:.12s}
.hero>div:first-child>:nth-child(3){animation-delay:.24s}
.hero>div:first-child>:nth-child(n+4){animation-delay:.36s}
.grid .card{animation:up .6s both}
.grid .card:nth-child(2){animation-delay:.12s}
.cta{animation:up .7s .36s both,pop 2.4s 1.4s ease-in-out infinite}
@media (max-width:700px){.hero,.pd{grid-template-columns:1fr}.hero-art{order:-1;aspect-ratio:16/10}.hero-art svg{width:34%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

    en:["A versatile basket with a floral design and soft cotton fabric, ideal for organizing pens, makeup, accessories and small items.","Handmade in Oman with fine details and a practical design that suits any space."]},
 f:{ar:["صناعة يدوية","قماش قطني","متعددة الاستخدامات","مناسبة للتنظيم والتخزين"],
    en:["Handmade","Cotton fabric","Versatile","Great for organizing and storage"]}}
];
const $=s=>document.querySelector(s);
let lang="ar",sel="M",cart={},cur="OMR";
const CUR={OMR:{r:1,d:3,s:{ar:"ر.ع.",en:"OMR"}},SAR:{r:9.753,d:2,s:{ar:"ر.س",en:"SAR"}},AED:{r:9.551,d:2,s:{ar:"د.إ",en:"AED"}},KWD:{r:0.7985,d:3,s:{ar:"د.ك",en:"KWD"}},BHD:{r:0.9779,d:3,s:{ar:"د.ب",en:"BHD"}},QAR:{r:9.467,d:2,s:{ar:"ر.ق",en:"QAR"}}};
try{lang=localStorage.getItem("vlang")==="en"?"en":"ar";const c=localStorage.getItem("vcur");if(c&&CUR[c])cur=c}catch(e){}
try{cart=JSON.parse(localStorage.getItem("vcart")||"{}")||{}}catch(e){cart={}}
let cartOpen=false,ord={loc:"",pay:"bank"};
try{ord=Object.assign(ord,JSON.parse(localStorage.getItem("vord")||"{}"))}catch(e){}
const sv=()=>{try{localStorage.setItem("vord",JSON.stringify(ord))}catch(e){}};
const t=k=>T[lang][k];
const save=()=>{try{localStorage.setItem("vcart",JSON.stringify(cart))}catch(e){}};
const omrf=n=>n.toFixed(3)+" "+t("cur");
const num=n=>(n*CUR[cur].r).toFixed(CUR[cur].d)+" "+CUR[cur].s[lang];
const price=(p,s)=>p.sp?p.sp[s]:p.p;
const from=p=>p.sp?`${t("from")} ${num(Math.min(...Object.values(p.sp)))}`:num(p.p);
const artHtml=p=>`<div class="art">${p.isNew?`<span class="tag">${t("new")}</span>`:""}${p.img?`<img src="${p.img}" alt="${p.n[lang]}">`:SVG[p.i]}</div>`;
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",1800)}
function chrome(){
document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
$("#ncur").innerHTML=Object.keys(CUR).map(c=>`<option value="${c}"${c===cur?" selected":""}>${c}</option>`).join("");$("#nh").textContent=t("home");$("#nig").textContent=t("ig");$("#nl").textContent=t("lang");
$("#fol").textContent=t("follow");$("#fig").textContent=t("ig");
$("#rts").innerHTML=t("rights")+'<span dir="ltr">saudhmd</span>';
$("#cbgo").textContent=t("send");document.title=t("title");
}
function home(){
$("#app").innerHTML=`<section class="hero"><div><h1>Velowra</h1><h2>${t("h2")}</h2><p>${t("hp")}</p><a class="cta" href="#shop" data-scroll>${t("browse")}</a> <a class="btn o" style="margin-inline-start:8px" target="_blank" rel="noopener" href="https://www.instagram.com/velowra">${t("igf")}</a></div><div class="hero-art" aria-hidden="true">${SVG.cross}</div></section>
<h2 class="sec" id="shop">${t("prods")}</h2>
<section class="grid">${P.map(p=>`<a class="card" href="#p${p.id}" data-card="${p.id}">${artHtml(p)}<div class="info"><h3>${p.n[lang]}</h3><span class="price">${from(p)}</span></div></a>`).join("")}</section>
<section class="perks"><div><b>${t("p1")}</b>${t("p1d")}</div><div><b>${t("p2")}</b>${t("p2d")}</div><div><b>${t("p3")}</b>${t("p3d")}</div></section>`;
}
function prod(p){
const pr=price(p,sel);
$("#app").innerHTML=`<button class="back" data-home>${t("back")}</button>
<article class="pd">${artHtml(p)}
<div><h1>${p.n[lang]}</h1><span class="price">${num(pr)}</span>${p.d[lang].map(x=>`<p>${x}</p>`).join("")}
<h2 style="font-size:18px;margin:16px 0 8px">${t("det")}</h2><ul>${p.f[lang].map(x=>`<li>${x}</li>`).join("")}</ul>
<div class="sizes" role="group"><b>${t("size")}</b>${["S","M","L"].map(s=>`<button class="sz" data-s="${s}" aria-pressed="${s===sel}">${s}${p.sp?`<small>${num(p.sp[s])}</small>`:""}</button>`).join("")}</div>
<div class="acts"><button class="btn" data-a="${p.id}_${sel}">${t("add")}</button><button class="btn o" data-buy="${p.id}_${sel}">${t("order")}</button><a class="btn o" target="_blank" rel="noopener" href="https://www.instagram.com/velowra">${t("igp")}</a></div></div></article>`;
}
function curP(){const m=/^p(\d+)$/.exec(location.hash.slice(1));return m&&P.find(x=>x.id==m[1])}
function render(top){chrome();const p=curP();p?prod(p):home();bar();if(top)window.scrollTo(0,0)}
function bar(){
let n=0,s=0,lines=[];
Object.keys(cart).forEach(k=>{const[i,z]=k.split("_"),p=P.find(x=>x.id==i);if(!p)return;const q=cart[k],pr=price(p,z||"M");n+=q;s+=q*pr;lines.push(`${q} × ${p.n[lang]} (${z||"-"}) = ${num(q*pr)}`)});
const b=$("#cbar");b.style.display=n?"block":"none";b.classList.toggle("open",cartOpen);
$("#cbt").textContent=t("incart")(n);$("#cbtg").textContent=cartOpen?"▾":t("checkout");
$("#lbl").textContent=t("loc");$("#loc").placeholder=t("locph");if(document.activeElement!==$("#loc"))$("#loc").value=ord.loc;
$("#pml").textContent=t("pay");$("#pb").textContent=t("bank");$("#ntl").textContent=t("note");$("#nt").placeholder=t("noteph");if(document.activeElement!==$("#nt"))$("#nt").value=ord.note||"";
$("#pn").textContent=t("bankn");
const dest=ord.dest||"om",ship=ord.ship||"home",fee=dest==="om"?(ship==="pickup"?1:2):0,needLoc=!(dest==="om"&&ship==="pickup"),tot=s+fee;
const shipLine=dest==="om"?(ship==="pickup"?t("sp")+" ("+num(1)+")":t("sh")+" ("+num(2)+")"):t("gccm");
$("#dll").textContent=t("dest");$("#do").textContent=t("oman");$("#dg").textContent=t("gulf");$("#sp").textContent=t("sp")+" – "+num(1);$("#sh").textContent=t("sh")+" – "+num(2);
$("#sm").style.display=dest==="om"?"flex":"none";$("#gn").textContent=dest==="gcc"?t("gccn"):(ship==="pickup"?t("pickn"):"");
$("#lbl").style.display=$("#loc").style.display=needLoc?"":"none";
document.querySelectorAll("input[name=dest]").forEach(r=>r.checked=r.value===dest);document.querySelectorAll("input[name=ship]").forEach(r=>r.checked=r.value===ship);
const ok=n>0&&(!needLoc||ord.loc.trim().length>2),g=$("#cbgo");g.textContent=ok?t("send"):t("needloc");g.classList.toggle("off",!ok);
const payT=t("bank");
g.href=ok?`https://wa.me/${WA}?text=`+encodeURIComponent(t("hi")+"\n"+lines.join("\n")+"\n🚚 "+shipLine+"\n"+t("total")+num(tot)+(cur!=="OMR"?" (≈ "+omrf(tot)+")":"")+(needLoc?"\n📍 "+t("locW")+": "+ord.loc.trim():"")+"\n💳 "+t("payW")+": "+payT+(ord.note&&ord.note.trim()?"\n📝 "+t("noteW")+": "+ord.note.trim():"")):"#";
}
function go(h){try{location.hash=h}catch(e){}render(true)}
document.addEventListener("click",e=>{
const x=e.target.closest("[data-card],[data-home],[data-lang],[data-s],[data-a],[data-clr],[data-scroll],[data-tg],[data-buy]");if(!x)return;
if(x.dataset.card){e.preventDefault();go("p"+x.dataset.card)}
else if("home" in x.dataset){e.preventDefault();go("")}
else if("lang" in x.dataset){lang=lang==="ar"?"en":"ar";try{localStorage.setItem("vlang",lang)}catch(e){}render(false)}
else if(x.dataset.s){sel=x.dataset.s;render(false)}
else if(x.dataset.a){cart[x.dataset.a]=(cart[x.dataset.a]||0)+1;save();bar();toast(t("added"))}
else if("clr" in x.dataset){cart={};cartOpen=false;save();bar()}
else if("tg" in x.dataset){cartOpen=!cartOpen;bar()}
else if(x.dataset.buy){cart[x.dataset.buy]=(cart[x.dataset.buy]||0)+1;save();cartOpen=true;bar()}
else if("scroll" in x.dataset){e.preventDefault();const s=$("#shop");s&&s.scrollIntoView({behavior:"smooth"})}
});
document.addEventListener("input",e=>{if(e.target.id==="loc"){ord.loc=e.target.value;sv();bar()}if(e.target.id==="nt"){ord.note=e.target.value;sv();bar()}});
document.addEventListener("change",e=>{if(e.target.id==="ncur"){cur=e.target.value;try{localStorage.setItem("vcur",cur)}catch(x){}render(false)}});
document.addEventListener("change",e=>{const n=e.target.name;if(n==="dest"||n==="ship"){ord[n]=e.target.value;sv();bar()}});
window.addEventListener("hashchange",()=>render(true));
render(false);
</script>
</body>
</html>
